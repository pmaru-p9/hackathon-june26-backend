[project]
name = "pcd-migration"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "kubernetes>=29.0",
  "openstacksdk>=3.0", "python-cinderclient>=9.5", "pydantic>=2.6",
  "pydantic-settings>=2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
