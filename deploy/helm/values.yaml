image:
  repository: pf9/pcd-migration
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

# Region namespace the POD runs in; must match app Settings.namespace
namespace: pcd-region-one

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
