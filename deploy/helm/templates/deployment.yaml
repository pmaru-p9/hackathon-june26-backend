apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcd-migration
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: pcd-migration
  template:
    metadata:
      labels:
        app: pcd-migration
    spec:
      serviceAccountName: pcd-migration
      containers:
        - name: pcd-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: PCD_MIGRATION_PROD
              value: "1"
            - name: NAMESPACE
              value: {{ .Values.namespace | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.resources | indent 12 }}
